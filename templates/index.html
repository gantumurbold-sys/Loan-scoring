<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Зээлийн Скоринг</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.05);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 2.5rem 2.5rem 2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.4rem;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .logo h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .subtitle { color: rgba(255,255,255,0.45); font-size: 0.85rem; margin-bottom: 2rem; }

    .form-grid { display: flex; flex-direction: column; gap: 1.1rem; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-wrap .prefix {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.4); font-size: 0.9rem; pointer-events: none;
    }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    input.has-prefix { padding-left: 2.2rem; }
    input:focus, select:focus {
      border-color: #667eea;
      background: rgba(102,126,234,0.1);
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    select option { background: #302b63; color: #fff; }

    .btn {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      letter-spacing: 0.02em;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Result panel */
    #result {
      display: none;
      margin-top: 1.8rem;
      padding: 1.6rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeUp .35s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .score-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .score-num {
      font-size: 3.2rem; font-weight: 800;
      line-height: 1;
    }
    .score-label { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 4px; }

    .badge {
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .badge.approved  { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
    .badge.manual_review { background: rgba(251,191,36,0.15);  color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .badge.rejected  { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }

    /* Gauge bar */
    .gauge-track {
      height: 8px; border-radius: 999px;
      background: rgba(255,255,255,0.1);
      overflow: hidden; margin-bottom: 0.4rem;
    }
    .gauge-fill {
      width: 0%;
      height: 100%; border-radius: 999px;
      transition: width .8s cubic-bezier(.4,0,.2,1);
      background: linear-gradient(90deg, #f87171 0%, #fbbf24 45%, #34d399 80%);
    }
    .gauge-marks {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; color: rgba(255,255,255,0.3); margin-bottom: 1.2rem;
    }

    .decision-msg {
      font-size: 0.9rem; color: rgba(255,255,255,0.7);
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      border-left: 3px solid currentColor;
      margin-bottom: 1.2rem;
    }
    .decision-msg.approved  { color: #34d399; }
    .decision-msg.manual_review { color: #fbbf24; }
    .decision-msg.rejected  { color: #f87171; }

    .proba-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem;
    }
    .proba-item {
      text-align: center;
      padding: 0.65rem 0.4rem;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
    }
    .proba-item .pval { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .proba-item .plbl { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .error-msg {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      color: #f87171;
      font-size: 0.85rem;
      display: none;
    }

    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">💳</div>
    <h1>Зээлийн Скоринг</h1>
  </div>
  <p class="subtitle">Зээлийн эрсдэлийн үнэлгээний систем — v1.0</p>

  <form id="loanForm" class="form-grid" novalidate>

    <div class="field">
      <label>Сарын цалин (₮)</label>
      <div class="input-wrap">
        <span class="prefix">₮</span>
        <input type="number" name="monthly_income" class="has-prefix"
               placeholder="2,000,000" min="1" required />
      </div>
    </div>

    <div class="field">
      <label>Ажил эрхлэлт</label>
      <select name="employment_type" title="Ажил эрхлэлт" required>
        <option value="" disabled selected>Ажил мэргэжлээ сонгоно уу</option>
        {% for emp in employment_types %}
        <option value="{{ loop.index0 }}">{{ emp }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label>Ажилласан жил</label>
      <input type="number" name="employment_years"
             placeholder="5" min="0" max="50" step="0.5" required />
    </div>

    <div class="field">
      <label>Хүссэн зээлийн дүн (₮)</label>
      <div class="input-wrap">
        <span class="prefix">₮</span>
        <input type="number" name="requested_amount" class="has-prefix"
               placeholder="10,000,000" min="1" required />
      </div>
    </div>

    <button type="submit" class="btn" id="submitBtn">Скор тооцох</button>
  </form>

  <div class="error-msg" id="errorMsg"></div>

  <div id="result">
    <div class="score-row">
      <div>
        <div class="score-num" id="scoreNum">—</div>
        <div class="score-label">Зээлийн скор / 1000</div>
      </div>
      <span class="badge" id="badge">—</span>
    </div>

    <div class="gauge-track">
      <div class="gauge-fill" id="gaugeFill"></div>
    </div>
    <div class="gauge-marks">
      <span>0</span><span>450</span><span>700</span><span>1000</span>
    </div>

    <div class="decision-msg" id="decisionMsg"></div>

    <div class="proba-grid">
      <div class="proba-item">
        <div class="pval" id="pApproved">—</div>
        <div class="plbl">Зөвшөөрөх %</div>
      </div>
      <div class="proba-item">
        <div class="pval" id="pReview">—</div>
        <div class="plbl">Гар шалгалт %</div>
      </div>
      <div class="proba-item">
        <div class="pval" id="pRejected">—</div>
        <div class="plbl">Татгалзах %</div>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('loanForm');
  const btn  = document.getElementById('submitBtn');
  const resultDiv  = document.getElementById('result');
  const errorDiv   = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.style.display = 'none';
    resultDiv.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Тооцож байна…';

    try {
      const fd = new FormData(form);
      const res = await fetch('/predict', { method: 'POST', body: fd });
      const data = await res.json();

      if (data.error) {
        errorDiv.textContent = data.error;
        errorDiv.style.display = 'block';
        return;
      }

      const score = data.score;
      const cls   = data.decision;

      document.getElementById('scoreNum').textContent = score;
      document.getElementById('scoreNum').style.color =
        cls === 'approved' ? '#34d399' : cls === 'manual_review' ? '#fbbf24' : '#f87171';

      const badge = document.getElementById('badge');
      badge.textContent = data.decision_label;
      badge.className = `badge ${cls}`;

      document.getElementById('gaugeFill').style.width = (score / 10) + '%';

      const msg = document.getElementById('decisionMsg');
      msg.textContent = data.decision_msg;
      msg.className = `decision-msg ${cls}`;

      document.getElementById('pApproved').textContent = data.proba_approved + '%';
      document.getElementById('pReview').textContent   = data.proba_review   + '%';
      document.getElementById('pRejected').textContent = data.proba_rejected + '%';

      resultDiv.style.display = 'block';
    } catch {
      errorDiv.textContent = 'Серверт холбогдоход алдаа гарлаа. Дахин оролдоно уу.';
      errorDiv.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Скор тооцох';
    }
  });
</script>
</body>
</html>
